<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Cheetita Tunai</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cheetita Tunai">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#fff}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fff;z-index:2;transition:opacity .4s;font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#5f6f6b}
  #splash img{width:min(260px,70vw)}
  #splash .bar{width:120px;height:4px;border-radius:2px;background:#e3f1ef;overflow:hidden}
  #splash .bar i{display:block;width:40%;height:100%;background:#0f766e;animation:jalan 1.1s ease-in-out infinite}
  @keyframes jalan{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  @media (prefers-reduced-motion:reduce){#splash .bar i{animation:none;width:100%}}
  #splash.hilang{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash"><img src="logo.png" alt="Cheetita Dim Sum"><div class="bar"><i></i></div><span>Membuka Cheetita Tunai…</span></div>
<iframe id="app" title="Cheetita Tunai" allow="camera" src="https://script.google.com/macros/s/AKfycbyrOC7aU0sviM0kOXa4ni8tCxjJ3nBE7b4p1ouJWIzDoJzbDcEj5Xhmk52nhaftggtf/exec"></iframe>
<script>
  // Sembunyi skrin pembuka bila app siap dimuat (atau selepas 12 saat)
  const s = document.getElementById('splash'), tutup = () => s.classList.add('hilang');
  document.getElementById('app').addEventListener('load', () => setTimeout(tutup, 600));
  setTimeout(tutup, 12000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
